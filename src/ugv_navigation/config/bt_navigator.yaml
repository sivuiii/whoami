# Dev 4 — /navigate_to_pose action server (Nav2 BT Navigator).  dev.md Dev 4 task 4.
#
# default_nav_to_pose_bt_xml is set by navigation.launch.py to this package's
# behavior_trees/navigate_to_pose_ugv.xml (overridable with the bt_xml launch arg).
bt_navigator:
  ros__parameters:
    # Map-frame goals (architecture §11). TF map -> odom -> base_link is Dev 2's.
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Only NavigateToPose is part of the Dev 4 contract.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
