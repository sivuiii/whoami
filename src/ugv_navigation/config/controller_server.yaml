# Dev 4 — Trajectory tracking: Nav2 Regulated Pure Pursuit (differential drive).
# architecture.md §6, §11; dev.md Dev 4 task 2.
#
# Output boundary (architecture §3.1): controller_server's `cmd_vel` is remapped to
# /cmd_vel_nav2 in navigation.launch.py. It is a CANDIDATE twist for Dev 5's safety
# authority, never the base /cmd_vel. No safety logic lives here.
#
# The local costmap (layers, footprint, inflation) lives in this process but is Dev 3's
# configuration, loaded from costmap_params_file.
#
# Values marked [ROBOT LIMIT] depend on the drive platform (Dev 5) and are
# conservative placeholders until the platform's real limits are published. Override
# them per robot with a config/robots/<robot>/ overlay (robot_params_file launch arg).
controller_server:
  ros__parameters:
    # Candidate twist type is geometry_msgs/Twist per dev.md §3 interface table.
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    # Wait for a fresh local costmap each cycle so hazards react with minimal latency.
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    # Velocity feedback for the controller. External: odometry from Dev 2 (VO) or Dev 5 (base).
    odom_topic: /odom
    use_realtime_priority: false

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Must move 0.5 m within 10 s or the BT runs recoveries.
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # --- Speed --------------------------------------------------------------
      desired_linear_vel: 0.4                 # [ROBOT LIMIT] m/s cruise
      rotate_to_heading_angular_vel: 0.8      # [ROBOT LIMIT] rad/s
      max_angular_accel: 2.0                  # [ROBOT LIMIT] rad/s^2
      use_cancel_deceleration: true
      cancel_deceleration: 1.0                # [ROBOT LIMIT] m/s^2 when a goal is canceled

      # --- Adaptive lookahead ---------------------------------------------------
      # lookahead = clamp(|v| * lookahead_time, min, max)
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.6                     # used only if velocity scaling is off
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false

      # --- Curvature-based speed regulation ---------------------------------------
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      # Curvature measured at a fixed distance, decoupled from the adaptive lookahead.
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 0.6

      # --- Collision-aware speed regulation ---------------------------------------
      # Slow down near costmap cost (proximity to Dev 3's inflated hazards).
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      # MUST equal cost_scaling_factor of Dev 3's local inflation layer, otherwise
      # the distance recovered from cost is wrong. Placeholder = Nav2 inflation default.
      inflation_cost_scaling_factor: 3.0
      # Forward-simulate the command and stop the candidate if a collision is predicted
      # within this horizon (uses the costmap footprint owned by Dev 3).
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # --- Goal approach ----------------------------------------------------------
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6

      # --- Differential drive -----------------------------------------------------
      # Rotate in place toward the path / goal heading instead of arcing.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      # Smac2D produces forward paths; reversing only happens through the BackUp recovery.
      allow_reversing: false
      stateful: true
      transform_tolerance: 0.1
